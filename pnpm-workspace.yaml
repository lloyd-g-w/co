packages:
  - apps/web
  - apps/desktop
  - packages/*

# Shared versions: reference with "catalog:" in package.json files.
catalog:
  "@solidjs/router": 2.0.0
  "@solidjs/vite-plugin": 3.0.1
  "@solidjs/web": 2.0.0
  "@tauri-apps/api": 2.12.5
  "@types/node": 26.6.6
  solid-js: 2.0.0
  typescript: 7.0.2
  # Vite+ ships its own Vite core; alias `vite` to it so plugins that peer on
  # vite (e.g. @solidjs/vite-plugin) share one copy and one set of types.
  # Keep in step with the vite-plus version (see `vp toolchain vite`).
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0

overrides:
  vite: "catalog:"
  vite-plus: "catalog:"

minimumReleaseAgeExclude:
  - "@solidjs/vite-plugin@3.0.1"
