[package]
name = "co-desktop"
description = "co's desktop app: the web frontend in a native window, and this machine as a tool host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The name `co_desktop_lib` keeps the lib apart from the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "co_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
co-tool-host = { workspace = true }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = "2.7.3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
